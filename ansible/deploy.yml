---
- name: Deploy OpsLab
  hosts: servers
  become: true

  vars:
    app_dir: "/home/{{ ansible_user }}/lab/docker"

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Install Docker Compose
      ansible.builtin.apt:
        name: docker-compose-v2
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/compose.yaml"
        dest: "{{ app_dir }}/compose.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: Copy environment file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/.env"
        dest: "{{ app_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Start OpsLab containers
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}"
      register: deploy_result
      changed_when: >
        'Created' in deploy_result.stderr or
        'Started' in deploy_result.stderr or
        'Recreated' in deploy_result.stderr

    - name: Show deployment result
      ansible.builtin.debug:
        var: deploy_result.stderr_lines
