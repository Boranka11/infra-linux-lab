name: OpsLab CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible yamllint

      - name: Validate YAML
        run: |
          yamllint ansible/*.yml
          yamllint docker/compose.yaml
          yamllint zabbix/compose.yaml

      - name: Check Ansible syntax
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/setup.yml --syntax-check
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --syntax-check

      - name: Validate Docker Compose
        run: |
          cp docker/.env.example docker/.env
          cp zabbix/.env.example zabbix/.env
          docker compose -f docker/compose.yaml config --quiet
          docker compose -f zabbix/compose.yaml config --quiet
